<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Практика по формам</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form>
      <fieldset class="fieldset">
        <legend>Ваши личные данные</legend>
        <label for="firstname">Ваше имя</label>
        <input
          type="text"
          id="firstname"
          name="firstname"
          placeholder="Имя"
          required
        />
        <label for="lastname">Ваша фамилия</label>
        <input
          type="text"
          id="lastname"
          name="lastname"
          placeholder="Фамилия"
          required
        />
        <label for="age">Ваш возраст</label>
        <input
          type="number"
          id="age"
          name="age"
          inputmode="numeric"
          min="18"
          max="65"
          placeholder="18"
          required
        />
        <label for="phone">Ваш номер телефона</label>
        <input type="tel" id="phone" name="phone" placeholder="+7" required />
        <label for="user_email">Ваша почта</label>
        <input
          type="email"
          id="user_email"
          name="email"
          inputmode="email"
          required
        />
      </fieldset>
      <fieldset class="fieldset-2">
        <label class="about" for="about"> Сообщение </label>
        <textarea
          class="about-1"
          id="about"
          name="about"
          placeholder="Расскажи о себе"
          required
        ></textarea>
          <div>
            <input class="checkbox" type="checkbox" id="term" required />Я
            принимаю правила
          </div>
        </label>
        <button class="button">Отправить</button>
      </fieldset>
    </form>
  </body>
</html>
